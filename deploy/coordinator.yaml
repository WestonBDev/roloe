# Roloe coordinator on the Radar cluster. Runs no model and holds no assistant login.
# The image is built from this repo by .github/workflows/deploy.yaml and pinned by commit in
# kustomization.yaml, so every push to main rolls the pod through Argo CD.
# One replica: encounter state lives in the process and on the /data volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: roloe-config
data:
  ROLOE_ENVIRONMENT: radar-cluster
  OTEL_SERVICE_NAME: roloe-coordinator
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: roloe-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels: { app: app }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: app
          ports:
            - { name: http, containerPort: 7420 }
          env:
            - { name: PORT, value: "7420" }
            - { name: ROLOE_DATA_DIR, value: /data }
            - { name: ROLOE_ENV_FILE, value: /nonexistent }
            # The URL phones use (QR codes point here). In git: Argo CD self-heal reverts manual edits.
            - { name: ROLOE_PUBLIC_URL, value: "https://roloe.cnh.radarhq.io" }
            # Behind the platform's router: trust its X-Forwarded-For for the guest rate limit.
            - { name: ROLOE_TRUST_PROXY, value: "1" }
          envFrom:
            - configMapRef: { name: roloe-config }
            # Created by scripts/k8s-secrets.sh from the git-ignored .env; values never enter git.
            - secretRef: { name: roloe-elastic, optional: true }
            - secretRef: { name: roloe-otel, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: roloe-data } }
        - { name: tmp, emptyDir: {} }
---
# The platform routes https://roloe.cnh.radarhq.io to Service "app", port 80.
apiVersion: v1
kind: Service
metadata:
  name: app
  labels: { app: app }
spec:
  selector: { app: app }
  ports:
    - { name: http, port: 80, targetPort: http }
