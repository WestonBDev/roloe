# Roloe coordinator on Kubernetes. No image registry needed: the pod runs the stock node:22-slim
# image, and an init container fetches this public repository at a pinned ref.
# One replica: encounter state lives in the process (and /data).
apiVersion: v1
kind: Namespace
metadata:
  name: roloe
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roloe-config
  namespace: roloe
data:
  ROLOE_REPO: https://github.com/WestonBDev/roloe.git
  ROLOE_REF: main
  # The URL phones use. Set it to the cluster's public address, or QR codes point at localhost.
  ROLOE_PUBLIC_URL: http://localhost:7420
  ROLOE_ENVIRONMENT: radar-cluster
  OTEL_SERVICE_NAME: roloe-coordinator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roloe-coordinator
  namespace: roloe
  labels: { app: roloe-coordinator }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: roloe-coordinator }
  template:
    metadata:
      labels: { app: roloe-coordinator }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch
          image: node:22-slim
          command: ["sh", "-c"]
          args:
            - |
              set -e
              cd /app
              node -e "
                const ref = process.env.ROLOE_REF, repo = process.env.ROLOE_REPO.replace(/\.git$/, '');
                fetch(repo + '/archive/' + ref + '.tar.gz').then(async r => { if (!r.ok) process.exit(1); require('fs').writeFileSync('/tmp/src.tgz', Buffer.from(await r.arrayBuffer())); });
              "
              tar -xzf /tmp/src.tgz --strip-components=1 -C /app
              HOME=/tmp npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          envFrom:
            - configMapRef: { name: roloe-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: coordinator
          image: node:22-slim
          workingDir: /app
          command: ["node", "src/coordinator.mjs"]
          ports:
            - { name: http, containerPort: 7420 }
          env:
            - { name: PORT, value: "7420" }
            - { name: ROLOE_DATA_DIR, value: /data }
            - { name: ROLOE_ENV_FILE, value: /nonexistent }
          envFrom:
            - configMapRef: { name: roloe-config }
            # kubectl -n roloe create secret generic roloe-elastic --from-literal=ELASTIC_URL=... --from-literal=ELASTIC_API_KEY=...
            - secretRef: { name: roloe-elastic, optional: true }
            # kubectl -n roloe create secret generic roloe-otel --from-literal=OTEL_EXPORTER_OTLP_ENDPOINT=... --from-literal=DASH0_AUTH_TOKEN=...
            - secretRef: { name: roloe-otel, optional: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: app, emptyDir: {} }
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: roloe-coordinator
  namespace: roloe
spec:
  selector: { app: roloe-coordinator }
  ports:
    - { name: http, port: 80, targetPort: http }
