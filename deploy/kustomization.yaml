# Argo CD deploys this folder to namespace team-roloe in the Radar hackathon cluster.
# The build-and-deploy GitHub Action sets the image below on every push to main;
# don't edit newName or newTag by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-roloe
resources:
  - coordinator.yaml
  - httproute.yaml
images:
  - name: app
    newName: ghcr.io/westonbdev/roloe
    newTag: "b544c76"
