<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roloe · scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/roloe.css">
</head>
<body>
<header class="top"><span class="wordmark">Roloe</span><a id="mine" class="btn ghost small" href="/r" hidden>Your Roloe</a></header>
<main>
  <article class="card" id="face"><span class="tab" id="tab">Opening…</span>
    <h2 id="name" class="who">&nbsp;</h2>
    <p class="quote" id="line"></p>
    <p class="cite" id="meta"></p>
  </article>
  <div id="as"></div>
  <form class="card" id="start" hidden><span class="tab">You</span>
    <label for="text"><h2>What are you working on, or stuck on right now?</h2></label>
    <textarea id="text" rows="3" maxlength="600" placeholder="One sentence is enough"></textarea>
    <label for="link" class="sr">Or a link: a public repo, a folder in one, a post, a README</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="or paste a repo link" style="margin-top:14px">
    <p class="state" style="margin-top:16px;color:var(--red)">Nothing private, please.</p>
    <button type="submit" id="send" class="wide" style="margin-top:16px">Send</button>
    <button type="button" class="ghost wide quiet" id="skip" style="margin-top:6px">Skip</button>
  </form>
  <p id="err" class="state bad" hidden></p>
  <div id="back"></div>
</main>
<script type="module" src="/rum.js"></script>
<script type="module" src="/guest.js"></script>
</body>
</html>
