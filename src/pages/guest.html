<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roloe · scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/roloe.css">
</head>
<body>
<header class="top"><span class="wordmark">Roloe</span><span class="muted">no app, no account</span></header>
<main>
  <article class="card" id="face"><span class="tab" id="tab">Opening…</span>
    <h2 id="name" style="font-size:30px;margin-bottom:0">&nbsp;</h2>
    <p class="quote" id="line" style="font-size:26px"></p>
    <p class="cite" id="meta"></p>
  </article>
  <div id="as"></div>
  <p style="font:600 18px/1.3 var(--sans)">Keep talking. Your agents go deep.</p>
  <form class="card" id="start" hidden><span class="tab">Your side</span>
    <label for="text"><h2>What are you working on, or stuck on right now?</h2></label>
    <textarea id="text" rows="3" maxlength="600" placeholder="One to three sentences"></textarea>
    <label for="link"><p style="margin-top:12px"><b>Or a link</b> <span class="muted">· a public repo, a folder in one, a post, a README</span></p></label>
    <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="https://github.com/you/project/tree/main/folder">
    <p class="state" style="margin-top:10px;color:var(--red)">Nothing private, please.</p>
    <p class="muted" style="font-size:14px">Whatever you give is scrubbed, read only for this meeting, and deleted when it ends. Nothing about you is looked up unless you give it here.</p>
    <div class="row" style="margin-top:14px"><button type="submit" id="send">Send</button><button type="button" class="ghost" id="skip">Skip</button></div>
  </form>
  <p id="err" class="state bad" hidden></p>
  <p class="muted" style="font-size:14px" id="how"></p>
</main>
<script type="module" src="/guest.js"></script>
</body>
</html>
