<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roloe · scan to meet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/roloe.css">
<style>
  /* Full-screen QR: black on white for any camera, readable at arm's length. */
  html, body { background: #fff; color: #111; height: 100%; }
  body { margin: 0; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; text-align: center; cursor: pointer; }
  h1 { font: 700 clamp(26px, 7vw, 64px)/1.05 var(--sans); margin: 0; letter-spacing: -.01em; }
  #qr { width: min(92vw, 72vh); aspect-ratio: 1; }
  #qr svg { width: 100%; height: 100%; display: block; }
  #url { font: 600 clamp(16px, 4.6vw, 34px)/1.2 var(--mono); overflow-wrap: anywhere; }
  .hint { font: 400 14px/1.3 var(--sans); color: #555; }
</style>
</head>
<body>
  <h1 id="title">Scan to meet</h1>
  <div id="qr" role="img" aria-label="QR code"></div>
  <p id="url"></p>
  <p class="hint">Point a phone camera here. No app, no account.</p>
<script type="module" src="/qr.js"></script>
</body>
</html>
