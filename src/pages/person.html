<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roloe · your meeting</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Familjen+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/roloe.css">
</head>
<body>
<header class="top"><span class="wordmark">Roloe</span><span id="when" class="mono"></span></header>
<main>
  <h1 id="title" style="font-size:28px">Opening…</h1>
  <div id="seal"></div>
  <div id="wait"></div>
  <div id="stack-edges" class="stack-edges" hidden></div>
  <section id="findings" aria-live="polite"></section>
  <div id="expect"></div>
  <div id="thanks"></div>
  <div id="guest"></div>
  <div id="receipt"></div>
  <p id="err" class="state bad" hidden></p>
  <footer class="row" style="justify-content:space-between;margin-top:8px">
    <p class="muted" id="consent" style="font-size:14px;max-width:34em"></p>
    <button id="stop" class="ghost" hidden>Stop</button>
  </footer>
</main>
<script type="module" src="/person.js"></script>
</body>
</html>
